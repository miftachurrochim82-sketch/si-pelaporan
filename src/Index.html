  <!-- Inisialisasi SI-PELAPORAN via AppCore -->
  <script>
    /* =========================================================
       Mixin khas SI-PELAPORAN: data & method halaman lokal.
       Auth/shell/toast/callServer/SIMPEG SWR Cache/Exporters disediakan AppCore v2.4.0.
       ========================================================= */
    const SIPelaporanMixin = {
      data() {
        return {
          // SSO Transition State
          ssoStatusMessage: 'Memvalidasi tiket Single Sign-On...',
          isSsoLoading: false,

          // Modal Panduan Aplikasi (pengganti menu Tentang)
          showPanduan: false,

          // Dashboard & referensi SIMPEG
          dashboardData: {},
          pegawaiList: [],
          unitList: [],
          jabatanList: [],
          _chartPegawaiUnit: null,
          _chartStatusJabatan: null,

          // Jenis laporan (selaras config jenis_laporan_list di setupApp)
          jenisLaporanList: ['rutin', 'insidental', 'khusus', 'pengawasan'],

          // Pelaporan (CRUD entitas PELAPORAN)
          pelaporanList: [],
          pelaporanPage: 1,
          pelaporanTotalPages: 1,
          pelaporanTotalData: 0,
          pelaporanSearch: '',
          pelaporanFilterStatus: '',
          pelaporanFilterPegawai: '',
          pelaporanFilterJenis: '',
          pelaporanLoading: false,
          pelaporanSaving: false,
          showPelaporanForm: false,
          pelaporanForm: {
            id: '',
            pegawai_id: '',
            tanggal: '',
            jenis_laporan: 'rutin',
            judul: '',
            isi: ''
          },

          // Analisa
          analisaData: null,
          analisaLoading: false,
          analisaTahun: '',
          analisaBulan: '',
          tahunList: [],
          bulanList: [],

          // Master Data referensi (tab)
          activeMasterTab: 'pegawai',
          pegawaiSearch: '',
          unitSearch: '',
          jabatanSearch: '',
          pegawaiRefPage: 1,
          unitRefPage: 1,
          jabatanRefPage: 1,
        };
      },

      computed: {
        hasSsoTicket() {
          try {
            const urlParams = new URLSearchParams(window.location.search);
            return Boolean(window.__SSO_TICKET__ || urlParams.get('ticket'));
          } catch(e) {
            return false;
          }
        },
        filteredPegawaiReferensi() {
          const q = String(this.pegawaiSearch || '').toLowerCase().trim();
          if (!q) return this.pegawaiList || [];
          return (this.pegawaiList || []).filter(p =>
            String(p.nip || '').toLowerCase().includes(q) ||
            String(p.nama || '').toLowerCase().includes(q) ||
            String(p.email || '').toLowerCase().includes(q)
          );
        },
        filteredUnitReferensi() {
          const q = String(this.unitSearch || '').toLowerCase().trim();
          if (!q) return this.unitList || [];
          return (this.unitList || []).filter(u =>
            String(u.kode_unit || '').toLowerCase().includes(q) ||
            String(u.nama_unit || '').toLowerCase().includes(q)
          );
        },
        filteredJabatanReferensi() {
          const q = String(this.jabatanSearch || '').toLowerCase().trim();
          if (!q) return this.jabatanList || [];
          return (this.jabatanList || []).filter(j =>
            String(j.kode_jabatan || '').toLowerCase().includes(q) ||
            String(j.nama_jabatan || '').toLowerCase().includes(q)
          );
        },
        paginatedPegawaiReferensi() {
          const start = (this.pegawaiRefPage - 1) * this.pageSize;
          return this.filteredPegawaiReferensi.slice(start, start + this.pageSize);
        },
        paginatedUnitReferensi() {
          const start = (this.unitRefPage - 1) * this.pageSize;
          return this.filteredUnitReferensi.slice(start, start + this.pageSize);
        },
        paginatedJabatanReferensi() {
          const start = (this.jabatanRefPage - 1) * this.pageSize;
          return this.filteredJabatanReferensi.slice(start, start + this.pageSize);
        },
        pegawaiRefTotalPages() {
          return Math.max(1, Math.ceil(this.filteredPegawaiReferensi.length / this.pageSize));
        },
        unitRefTotalPages() {
          return Math.max(1, Math.ceil(this.filteredUnitReferensi.length / this.pageSize));
        },
        jabatanRefTotalPages() {
          return Math.max(1, Math.ceil(this.filteredJabatanReferensi.length / this.pageSize));
        },
        pegawaiPerUnitTop() {
          const counts = {};
          (this.pegawaiList || []).forEach(p => {
            const uid = String(p.unit_id || 'tanpa_unit');
            counts[uid] = (counts[uid] || 0) + 1;
          });
          return Object.keys(counts)
            .map(uid => ({
              nama_unit: uid === 'tanpa_unit' ? '(Tanpa Unit)' : this.namaUnit(uid),
              jumlah: counts[uid]
            }))
            .sort((a, b) => b.jumlah - a.jumlah)
            .slice(0, 5);
        },
        unitTanpaPegawai() {
          const filled = {};
          (this.pegawaiList || []).forEach(p => { filled[String(p.unit_id || '')] = true; });
          return (this.unitList || []).filter(u => !filled[String(u.unit_id)]).length;
        },
        jabatanAktif() {
          return (this.jabatanList || []).filter(j =>
            String(j.status_jabatan || 'DEFINITIF').toUpperCase() !== 'KOSONG'
          ).length;
        }
      },

      methods: {
        // ================= SSO REDIRECT =================
        goToPlatform() {
          const platformUrl = 'https://script.google.com/macros/s/AKfycbwh_OUVqmxLcuF81FHmPZtT33Wrm8Ce9Da1SQ3hfkSr7gM5P8ofyAlHSgW40mq3eo-PoQ/exec';
          const back = window.location.href.split('?')[0];
          const sep = platformUrl.includes('?') ? '&' : '?';
          const targetUrl = platformUrl + sep + 'redirect=' + encodeURIComponent(back);
          try {
            if (window.top && window.top !== window) {
              window.top.location.href = targetUrl;
            } else {
              window.location.href = targetUrl;
            }
          } catch (e) {
            window.open(targetUrl, '_top');
          }
        },

        // ================= REFERENSI (SWR CACHE v2.4.0) =================
        async loadReferensi(force = false) {
          try {
            await this.loadMasterSIMPEG(force);
          } catch (e) {
            console.error('[loadReferensi] Error:', e);
            this.showToast('Gagal memuat data referensi: ' + e.message, 'error');
          }
        },

        // ================= DASHBOARD =================
        async loadDashboard() {
          this.loading = true;
          try {
            const res = await this.callServer('dashboard');
            if (res.success) this.dashboardData = res.data || {};
            else this.showToast(res.error || 'Gagal memuat data dashboard', 'error');
          } catch (e) {
            this.showToast(e.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        async refreshDashboard() {
          await Promise.all([
            this.loadDashboard(),
            this.loadReferensi(true),
            this.loadAnalisa()
          ]);
          await this.renderDashboardCharts();
          this.showToast('Dashboard diperbarui');
        },

        // ================= STRUKTUR ORGANISASI & ESELON III =================
        getPegawaiEselon3Distribution() {
          const pegawaiList = this.pegawaiList || [];
          const unitList = this.unitList || [];
          const jabatanList = this.jabatanList || [];

          const unitMap = {};
          unitList.forEach(u => { unitMap[String(u.unit_id)] = u; });

          const jabatanMap = {};
          jabatanList.forEach(j => { jabatanMap[String(j.jabatan_id)] = j; });

          // Inisialisasi 6 Standar Kategori Eselon III / Organisasi
          const groups = {
            'Kepala Satuan / Pimpinan': 0,
            'Sekretariat': 0,
            'Kelompok Jabatan Fungsional (JFT)': 0,
            'Bidang Penegakan Perda': 0,
            'Bidang Ketertiban Umum & Ketenteraman': 0,
            'Bidang Pemadam Kebakaran & Penyelamatan': 0
          };

          pegawaiList.forEach(p => {
            const jab = jabatanMap[String(p.jabatan_id || '')] || {};
            const unit = unitMap[String(p.unit_id || '')] || {};
            const namaJab = String(jab.nama_jabatan || '').toLowerCase();
            const jenisJab = String(jab.jenis_jabatan || p.jenis_jabatan || '').toUpperCase();
            const namaUnit = String(unit.nama_unit || p.unit_nama || '').toLowerCase();

            // 1. Kepala Satuan / Pimpinan
            if (namaJab.includes('kepala satuan') || namaJab.includes('kasatpol') || namaJab.includes('kepala dinas') || namaJab.includes('kepala badan') || (namaJab.includes('kepala') && !namaJab.includes('seksi') && !namaJab.includes('subbag') && !namaJab.includes('bidang') && !namaJab.includes('sub'))) {
              groups['Kepala Satuan / Pimpinan']++;
              return;
            }

            // 2. Kelompok Jabatan Fungsional (JFT)
            if (jenisJab.includes('FUNGSIONAL') || jenisJab.includes('JFT') || namaUnit.includes('fungsional') || namaUnit.includes('jft') || (namaJab.includes('ahli') || namaJab.includes('terampil') || namaJab.includes('pranata') || namaJab.includes('penyuluh') || namaJab.includes('pengawas') || namaJab.includes('auditor') || namaJab.includes('polisi pamong praja') || namaJab.includes('pemadam kebakaran')) && !namaJab.includes('kepala') && !namaJab.includes('subbag') && !namaJab.includes('kasi')) {
              groups['Kelompok Jabatan Fungsional (JFT)']++;
              return;
            }

            // 3. Sekretariat (termasuk Subbag: Umum, Keuangan, Kepegawaian, Perencanaan)
            if (namaUnit.includes('sekretariat') || namaUnit.includes('subbag') || namaUnit.includes('sub bagian') || namaUnit.includes('keuangan') || namaUnit.includes('umum') || namaUnit.includes('kepegawaian') || namaUnit.includes('perencanaan')) {
              groups['Sekretariat']++;
              return;
            }

            // 4. Bidang I: Penegakan Perda & Perkada (dan Seksi di dalamnya)
            if (namaUnit.includes('penegakan') || namaUnit.includes('perda') || namaUnit.includes('perundang') || namaUnit.includes('penyelidikan') || namaUnit.includes('penindakan') || namaUnit.includes('pembinaan dan pengawasan')) {
              groups['Bidang Penegakan Perda']++;
              return;
            }

            // 5. Bidang II: Ketertiban Umum & Ketenteraman Masyarakat (dan Seksi di dalamnya)
            if (namaUnit.includes('ketertiban') || namaUnit.includes('trantib') || namaUnit.includes('tibum') || namaUnit.includes('operasi') || namaUnit.includes('pengendalian') || namaUnit.includes('pengamanan') || namaUnit.includes('masyarakat')) {
              groups['Bidang Ketertiban Umum & Ketenteraman']++;
              return;
            }

            // 6. Bidang III: Pemadam Kebakaran & Penyelamatan (dan Seksi di dalamnya)
            if (namaUnit.includes('damkar') || namaUnit.includes('pemadam') || namaUnit.includes('kebakaran') || namaUnit.includes('penyelamatan') || namaUnit.includes('pencegahan') || namaUnit.includes('sarana prasarana')) {
              groups['Bidang Pemadam Kebakaran & Penyelamatan']++;
              return;
            }

            // Fallback ke Kelompok JFT
            groups['Kelompok Jabatan Fungsional (JFT)']++;
          });

          return Object.keys(groups).map(k => ({ nama: k, jumlah: groups[k] }));
        },

        async renderDashboardCharts() {
          const hasChart = await this.ensureChartLibrary();
          if (!hasChart) return;

          this.$nextTick(() => {
            if (typeof Chart === 'undefined') return;
            const isDark = this.isDarkMode;
            const textColor = isDark ? '#cbd5e1' : '#334155';
            const gridColor = isDark ? 'rgba(51, 65, 85, 0.4)' : 'rgba(226, 232, 240, 0.8)';

            const ctx1 = document.getElementById('chartPegawaiUnit');
            if (ctx1) {
              if (this._chartPegawaiUnit) this._chartPegawaiUnit.destroy();
              const eselon3Data = this.getPegawaiEselon3Distribution();

              // 6 Palet Warna Khusus untuk 6 Divisi Eselon III
              const divisionColors = [
                'rgba(99, 102, 241, 0.85)',  // Kepala Satuan (Indigo)
                'rgba(16, 185, 129, 0.85)',  // Sekretariat (Emerald)
                'rgba(245, 158, 11, 0.85)',  // Kelompok JFT (Amber)
                'rgba(14, 165, 233, 0.85)',  // Bidang I (Sky)
                'rgba(168, 85, 247, 0.85)',  // Bidang II (Purple)
                'rgba(244, 63, 94, 0.85)'    // Bidang III (Rose)
              ];

              const divisionBorders = [
                '#6366f1', '#10b981', '#f59e0b', '#0ea5e9', '#a855f7', '#f43f5e'
              ];

              this._chartPegawaiUnit = new Chart(ctx1, {
                type: 'bar',
                data: {
                  labels: eselon3Data.map(t => t.nama),
                  datasets: [{
                    label: 'Jumlah Personel',
                    data: eselon3Data.map(t => t.jumlah),
                    backgroundColor: eselon3Data.map((_, idx) => divisionColors[idx % divisionColors.length]),
                    borderColor: eselon3Data.map((_, idx) => divisionBorders[idx % divisionBorders.length]),
                    borderWidth: 1.5,
                    borderRadius: 8
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  scales: {
                    x: {
                      ticks: {
                        color: textColor,
                        font: { size: 10, weight: '500' },
                        callback: function(val, index) {
                          const label = eselon3Data[index] ? eselon3Data[index].nama : '';
                          return label.length > 22 ? label.slice(0, 20) + '...' : label;
                        }
                      },
                      grid: { display: false }
                    },
                    y: { ticks: { color: textColor, precision: 0 }, grid: { color: gridColor } }
                  },
                  plugins: {
                    legend: { display: false },
                    tooltip: {
                      callbacks: {
                        title: function(items) {
                          const idx = items[0].dataIndex;
                          return eselon3Data[idx] ? eselon3Data[idx].nama : '';
                        },
                        label: function(item) {
                          return ` Jumlah Personel: ${item.formattedValue} orang`;
                        }
                      }
                    }
                  }
                }
              });
            }

            const ctx2 = document.getElementById('chartStatusJabatan');
            if (ctx2) {
              if (this._chartStatusJabatan) this._chartStatusJabatan.destroy();
              let definitif = 0, plt = 0, kosong = 0;
              (this.jabatanList || []).forEach(j => {
                const s = String(j.status_jabatan || 'DEFINITIF').toUpperCase();
                if (s === 'PLT') plt++;
                else if (s === 'KOSONG') kosong++;
                else definitif++;
              });

              this._chartStatusJabatan = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                  labels: ['DEFINITIF', 'PLT', 'KOSONG'],
                  datasets: [{
                    data: [definitif, plt, kosong],
                    backgroundColor: ['#10b981', '#f59e0b', '#f43f5e'],
                    borderWidth: 2,
                    borderColor: isDark ? '#0f172a' : '#ffffff'
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: { position: 'bottom', labels: { color: textColor, font: { weight: 'bold', size: 10 } } }
                  }
                }
              });
            }
          });
        },

        // ================= PELAPORAN (CRUD) =================
        async loadPelaporan(page = 1) {
          this.pelaporanPage = page;
          this.pelaporanLoading = true;
          try {
            const res = await this.callServer('get_pelaporan_list', {
              page,
              limit: this.pageSize,
              search: this.pelaporanSearch,
              filters: {
                status: this.pelaporanFilterStatus,
                pegawai_id: this.pelaporanFilterPegawai,
                jenis_laporan: this.pelaporanFilterJenis
              }
            });
            if (res && res.success) {
              this.pelaporanList = Array.isArray(res.data) ? res.data : [];
              this.pelaporanTotalPages = (res.meta && res.meta.total_pages) || 1;
              this.pelaporanTotalData = (res.meta && res.meta.total) || this.pelaporanList.length;
            } else {
              this.pelaporanList = [];
              this.showToast((res && res.error) || 'Gagal memuat data pelaporan', 'error');
            }
          } catch (e) {
            this.pelaporanList = [];
            this.showToast('Gagal memuat pelaporan: ' + e.message, 'error');
          } finally {
            this.pelaporanLoading = false;
          }
        },

        openPelaporanForm(item = null) {
          if (item) {
            const trimT = (v) => String(v || '').includes('T') ? String(v).slice(0, 10) : (v || '');
            this.pelaporanForm = Object.assign({}, item, { tanggal: trimT(item.tanggal) });
          } else {
            this.pelaporanForm = {
              id: '',
              pegawai_id: (this.currentUser && this.currentUser.pegawai_id) || '',
              tanggal: this.todayIso_(),
              jenis_laporan: 'rutin',
              judul: '',
              isi: ''
            };
          }
          this.showPelaporanForm = true;
        },

        async savePelaporan() {
          this.pelaporanSaving = true;
          try {
            const res = await this.callServer('save_pelaporan', { record: this.pelaporanForm });
            if (res.success) {
              this.showPelaporanForm = false;
              await Promise.all([
                this.loadPelaporan(this.pelaporanPage),
                this.loadDashboard()
              ]);
              this.showToast('Pelaporan berhasil disimpan');
            } else {
              this.showToast(res.error || 'Gagal menyimpan pelaporan', 'error');
            }
          } catch (e) {
            this.showToast(e.message, 'error');
          } finally {
            this.pelaporanSaving = false;
          }
        },

        async deletePelaporan(item) {
          if (!confirm(`Hapus pelaporan "${item.judul || item.id}"?`)) return;
          try {
            const res = await this.callServer('delete_pelaporan', { id: item.id });
            if (res.success) {
              await this.loadPelaporan(this.pelaporanPage);
              if (!this.pelaporanList.length && this.pelaporanPage > 1) {
                await this.loadPelaporan(this.pelaporanPage - 1);
              }
              await this.loadDashboard();
              this.showToast('Pelaporan berhasil dihapus');
            } else {
              this.showToast(res.error || 'Gagal menghapus pelaporan', 'error');
            }
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },

        async verifikasiPelaporan(item, status) {
          const wajib = status === 'revisi' || status === 'ditolak';
          const catatan = prompt(
            status === 'disetujui' ? 'Catatan persetujuan (opsional):' :
            status === 'revisi' ? 'Catatan revisi (wajib diisi):' : 'Catatan penolakan (wajib diisi):', '');
          if (catatan === null) return;
          if (wajib && !String(catatan).trim()) {
            this.showToast('Catatan ' + status + ' wajib diisi', 'error');
            return;
          }
          try {
            const res = await this.callServer('verifikasi_pelaporan', {
              id: item.id,
              status: status,
              catatan_verifikator: catatan || ''
            });
            if (res.success) {
              await this.loadPelaporan(this.pelaporanPage);
              this.showToast('Pelaporan ' + status);
            } else {
              this.showToast(res.error || 'Gagal verifikasi', 'error');
            }
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },

        resetPelaporanFilter() {
          this.pelaporanFilterStatus = '';
          this.pelaporanFilterPegawai = '';
          this.pelaporanFilterJenis = '';
          this.pelaporanSearch = '';
          this.loadPelaporan(1);
        },

        exportPelaporanExcel() {
          this.exportExcel(this.pelaporanList, `Data_Pelaporan_${this.todayIso_()}`, 'Data Pelaporan');
        },

        exportPelaporanPDF() {
          this.exportPDF(
            [
              { header: 'No', field: (row, i) => i + 1 },
              { header: 'Tanggal', field: row => this.formatDateDisplay(row.tanggal) },
              { header: 'Judul', key: 'judul' },
              { header: 'Jenis', key: 'jenis_laporan' },
              { header: 'Pegawai', field: row => this.namaPegawai(row.pegawai_id) },
              { header: 'Status', field: row => row.status || 'menunggu' }
            ],
            this.pelaporanList,
            `Data_Pelaporan_${this.todayIso_()}`,
            'Daftar Pelaporan Pegawai'
          );
        },

        // ================= PAGINATION HELPER REFERENSI =================
        loadPegawai(page) { this.pegawaiRefPage = page; },
        resetPegawaiFilter() { this.pegawaiSearch = ''; this.pegawaiRefPage = 1; },
        exportPegawaiExcel() {
          this.exportExcel(this.pegawaiList, `Data_Pegawai_${this.todayIso_()}`, 'Pegawai');
        },
        exportPegawaiPDF() {
          this.exportPDF(
            [
              { header: 'No', field: (p, i) => i + 1 },
              { header: 'NIP', key: 'nip' },
              { header: 'Nama', key: 'nama' },
              { header: 'Email', key: 'email' },
              { header: 'Unit', field: p => this.namaUnit(p.unit_id) }
            ],
            this.pegawaiList,
            `Data_Pegawai_${this.todayIso_()}`,
            'Daftar Pegawai SIMPEG'
          );
        },
        loadJabatan(page) { this.jabatanRefPage = page; },
        resetJabatanFilter() { this.jabatanSearch = ''; this.jabatanRefPage = 1; },
        loadUnit(page) { this.unitRefPage = page; },
        resetUnitFilter() { this.unitSearch = ''; this.unitRefPage = 1; },

        // ================= ANALISA =================
        async loadAnalisa() {
          this.analisaLoading = true;
          try {
            const res = await this.callServer('analytics', { tahun: this.analisaTahun, bulan: this.analisaBulan });
            if (res && res.success) this.analisaData = res.data || {};
            else this.showToast((res && res.error) || 'Gagal memuat analisa', 'error');
          } catch (e) {
            this.showToast(e.message, 'error');
          } finally {
            this.analisaLoading = false;
          }
        },

        async downloadAnalisaPDF() {
          if (typeof jspdf === 'undefined' || !jspdf.jsPDF) {
            this.showToast('Memuat modul PDF...', 'info');
            await AppCore.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
            await AppCore.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
          }
          const { jsPDF } = jspdf;
          const doc = new jsPDF();
          const a = this.analisaData || {};
          doc.setFontSize(14);
          doc.text('Analisa Pelaporan Pegawai', 14, 16);
          doc.setFontSize(10);
          const ringkas = doc.splitTextToSize(String(a.ringkasan || '-'), 180);
          doc.text(ringkas, 14, 24);
          let y = 24 + ringkas.length * 5 + 4;
          const byJenis = a.by_jenis || {};
          doc.autoTable({ startY: y, head: [['Jenis Laporan', 'Jumlah']], body: Object.keys(byJenis).map(k => [k, byJenis[k]]) });
          y = doc.lastAutoTable.finalY + 6;
          const temuan = (a.temuan || []).map(t => `[${t.level}] ${t.pesan}`);
          const rekom = (a.rekomendasi || []).map(r => `[${r.prioritas}] ${r.tindakan}`);
          doc.autoTable({ startY: y, head: [['Temuan']], body: temuan.map(t => [t]) });
          y = doc.lastAutoTable.finalY + 6;
          doc.autoTable({ startY: y, head: [['Rekomendasi']], body: rekom.map(r => [r]) });
          doc.save(`Analisa_Pelaporan_${this.todayIso_()}.pdf`);
        }
      },

      created() {
        const now = new Date().getFullYear();
        this.tahunList = [now, now - 1, now - 2, now - 3, now - 4];
        this.bulanList = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
          'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      },

      mounted() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const t = urlParams.get('ticket') || window.__SSO_TICKET__ || '';
          if (t) {
            this.isSsoLoading = true;
            this.ssoStatusMessage = 'Memvalidasi tiket Single Sign-On...';
            setTimeout(() => {
              if (!this.token) this.ssoStatusMessage = 'Menyinkronkan profil pegawai & hak akses...';
            }, 800);
            setTimeout(() => {
              if (!this.token) this.ssoStatusMessage = 'Mempersiapkan dashboard SI-PELAPORAN...';
            }, 1600);
          }
        } catch (e) {}
      }
    };

    /* =========================================================
       Bootstrap aplikasi via AppCore (app-core.js dari CDN)
       ========================================================= */
    const app = AppCore.create({
      appTitle: 'SI-PELAPORAN',
      storagePrefix: 'sipelaporan',
      initialPage: 'dashboard',

      // TODO: ganti dengan URL exec SI-Platform Anda
      platformUrl: 'https://script.google.com/macros/s/AKfycbwh_OUVqmxLcuF81FHmPZtT33Wrm8Ce9Da1SQ3hfkSr7gM5P8ofyAlHSgW40mq3eo-PoQ/exec',

      brand: {
        title: 'SI-PELAPORAN',
        subtitle: 'Pemkab Trenggalek',
        logoChar: 'P',
        logoIcon: 'fa-solid fa-file-lines',
        logoSvg: "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120' width='100' height='120'%3E%3Cpath d='M50 5 L90 25 V65 C90 90 50 115 50 115 C50 115 10 90 10 65 V25 Z' fill='%231e3a8a' stroke='%23f59e0b' stroke-width='4'/%3E%3Cpath d='M50 15 L80 32 V62 C80 82 50 102 50 102 C50 102 20 82 20 62 V32 Z' fill='%23047857'/%3E%3Ccircle cx='50' cy='55' r='18' fill='%23fbbf24'/%3E%3Cpath d='M50 40 L54 50 L64 50 L56 56 L59 66 L50 60 L41 66 L44 56 L36 50 L46 50 Z' fill='%23dc2626'/%3E%3Ctext x='50' y='93' font-family='Arial, sans-serif' font-size='9' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3ETRENGGALEK%3E%3C/text%3E%3C/svg%3E"
      },

      menu: [
        { name: 'Utama', items: [
          { id: 'dashboard', label: 'Dashboard', icon: 'fa-solid fa-gauge-high' },
          { id: 'pelaporan', label: 'Pelaporan', icon: 'fa-solid fa-file-lines' },
          { id: 'analisa', label: 'Analisa Pelaporan', icon: 'fa-solid fa-chart-pie' }
        ]},
        { name: 'Manajemen Data', items: [
          { id: 'profil', label: 'Profil Saya', icon: 'fa-solid fa-user-tie' },
          { id: 'master_data', label: 'Master Data', icon: 'fa-solid fa-database' }
        ]},
        { name: 'Sistem', items: [
          { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-solid fa-gear', adminOnly: true }
        ]}
      ],

      pageIcons: {
        dashboard: 'fa-solid fa-gauge-high',
        pelaporan: 'fa-solid fa-file-lines',
        analisa: 'fa-solid fa-chart-pie',
        profil: 'fa-solid fa-user-tie',
        master_data: 'fa-solid fa-database',
        pengaturan: 'fa-solid fa-gear'
      },

      onNavigate(vm, page) {
        if (page === 'dashboard') {
          vm.renderDashboardCharts();
        } else if (page === 'pelaporan') {
          vm.loadPelaporan(1);
          vm.loadedPages['pelaporan'] = true;
        } else if (page === 'master_data') {
          vm.loadedPages['master_data'] = true;
        } else if (page === 'analisa' && !vm.loadedPages['analisa']) {
          vm.loadAnalisa();
          vm.loadedPages['analisa'] = true;
        }
      },

      onDarkToggle(vm) {
        if (vm.currentPage === 'dashboard') vm.renderDashboardCharts();
      },

      async initApp(vm) {
        if (vm.dataLoaded) return;
        await Promise.all([
          vm.loadDashboard(),
          vm.loadReferensi(),
          vm.loadAnalisa()
        ]);
        vm.renderDashboardCharts();
      },

      mixins: [SIPelaporanMixin]
    });

    app.mount('#app');
  </script>
</body>
</html>
